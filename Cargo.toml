[package]
name = "xiaohong-resource-governor"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Domain-agnostic resource-aware execution placement and fallback planner"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[[example]]
name = "route_demo"
path = "examples/route_demo.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
